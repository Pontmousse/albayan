name: Stripe donations CI

on:
  push:
    branches:
      - feature/stripe-donations

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python -m unittest tests.test_donations -v
      - run: PYTHONPATH=. python -m unittest tests.test_email_service tests.test_email_settings tests.test_dates tests.test_agent_auth -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:donations
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  emails:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emails
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: emails/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run assets:check
      - run: npm run test:unit
      - run: npm run test:donation-template
      - run: npm run test:sync
