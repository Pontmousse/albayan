name: Stripe donations CI

on:
  push:
    branches:
      - feature/stripe-donations
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/stripe-donations-ci.yml"
      - "backend/app/core/config.py"
      - "backend/app/models/donation.py"
      - "backend/app/routers/donations.py"
      - "backend/app/routers/webhooks.py"
      - "backend/app/schemas/donation.py"
      - "backend/app/services/donation_email_service.py"
      - "backend/app/services/donation_service.py"
      - "backend/tests/test_donations.py"
      - "backend/alembic/versions/*donations*.py"
      - "frontend/src/app/daam-al-bayan/**"
      - "frontend/src/components/donations/**"
      - "frontend/src/components/main-nav.tsx"
      - "frontend/src/components/journal/quranic-opening.tsx"
      - "frontend/src/lib/nav-config.ts"
      - "frontend/src/lib/donations.ts"
      - "frontend/scripts/check-donations-ux.mjs"
      - "emails/src/donations/**"
      - "emails/scripts/check-donation-template.mjs"
      - "emails/templates.yaml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python -m unittest tests.test_donations -v
      - run: PYTHONPATH=. python -m unittest tests.test_email_service tests.test_email_settings tests.test_dates tests.test_agent_auth -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:donations
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  emails:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emails
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: emails/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run assets:check
      - run: npm run test:unit
      - run: npm run test:donation-template
      - run: npm run test:sync
