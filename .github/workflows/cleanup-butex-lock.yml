name: Clean BuTeX lockfile diff

on:
  push:
    branches:
      - chore/bump-butex-7.1.1

permissions:
  contents: write

jobs:
  cleanup-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/bump-butex-7.1.1
      - name: Restore unrelated lock metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/package-lock.json')
          text = path.read_text()
          marker = '''    "node_modules/fsevents": {\n      "version": "2.3.2",\n      "resolved": "https://registry.npmjs.org/fsevents/-/fsevents-2.3.2.tgz",\n      "integrity": "sha512-xiqMQR4xAeHTuB9uWm+fFRcIOgKBMiOBP+eXiyT7jsgVCq1bkVygt00oASowB7EdtpOHaaPgKt812P9ab+DDKA==",\n      "hasInstallScript": true,'''
          replacement = marker.replace('      "hasInstallScript": true,', '      "dev": true,\n      "hasInstallScript": true,')
          if marker not in text:
              raise SystemExit('Expected fsevents lock entry not found')
          path.write_text(text.replace(marker, replacement, 1))
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore: keep BuTeX lock diff scoped"
          git push origin HEAD:chore/bump-butex-7.1.1
