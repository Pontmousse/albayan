name: Temporary BuTeX 6.1.5 validation

on:
  push:
    branches:
      - chore/bump-butex-6.1.5
    paths:
      - .github/workflows/butex-6.1.5-validation-temp.yml

permissions:
  contents: write

jobs:
  validate-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Clean install
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/butex-6.1.5-validation-temp.yml
          git commit -m "ci: remove temporary BuTeX validation workflow"
          git push
