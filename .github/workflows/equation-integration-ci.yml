  pull_request:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/equation-integration-ci.yml"
      - "backend/app/core/config.py"
      - "backend/app/core/tracing.py"
      - "backend/app/main.py"
      - "backend/app/routers/dev_diagnostics.py"
      - "backend/app/routers/draft_equations.py"
      - "backend/app/routers/equation_mappings.py"
      - "backend/app/routers/unit_conventions.py"
      - "backend/app/schemas/unit_conventions.py"
      - "backend/app/services/unit_conventions_service.py"
      - "backend/app/models/article.py"
      - "backend/alembic/versions/023_article_unit_conventions.py"
      - "backend/tests/test_unit_conventions.py"
      - "backend/tests/test_unit_discovery_contract.py"
      - "backend/tests/test_used_unit_service.py"
      - "backend/app/services/used_unit_service.py"
      - "backend/app/schemas/used_units.py"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/butex-candidate.lock.json"
      - "frontend/scripts/prepare-butex-candidate.mjs"
      - "frontend/src/lib/butex-candidate-contract.test.ts"
      - "frontend/src/components/dashboard/units-panel.tsx"
      - "frontend/src/lib/api/units.ts"
      - "frontend/src/lib/unit-conventions.ts"
      - "frontend/src/lib/unit-conventions.test.ts"
      - "backend/app/routers/math_authoring.py"
      - "backend/app/schemas/article.py"
      - "backend/app/schemas/dev_diagnostics.py"
      - "backend/app/schemas/draft_command.py"
      - "backend/app/schemas/draft_equation.py"
      - "backend/app/schemas/equation_mapping.py"
      - "backend/app/schemas/math_authoring.py"
      - "backend/app/services/article_draft_service.py"
      - "backend/app/services/burhan_client.py"
      - "backend/app/services/burhan_reverse_client.py"
      - "backend/app/services/butex_diagnostic_client.py"
      - "backend/app/services/butex_worker_client.py"
      - "backend/app/services/draft_equation_service.py"
      - "backend/app/services/equation_diagnostic_service.py"
      - "backend/app/services/document_diagnostic_service.py"
      - "backend/tests/test_document_diagnostics.py"
      - "backend/tests/test_draft_revisions.py"
      - "backend/tests/test_round3_butex_consumer_contract.py"
      - "backend/app/services/equation_mapping_service.py"
      - "backend/app/services/equation_projection_service.py"
      - "backend/app/services/math_authoring_capabilities.py"
      - "backend/tests/test_burhan_api_key.py"
      - "backend/tests/test_burhan_math_commands.py"
      - "backend/tests/test_butex_math_projection_client.py"
      - "backend/tests/test_butex_worker_client.py"
      - "backend/tests/test_butex_diff_client.py"
      - "backend/tests/test_butex_real_worker_integration.py"
      - "mcp_server/tests/test_document_schema.py"
      - "mcp_server/src/albayan_mcp/schemas/document.py"
      - "backend/app/schemas/document.py"
      - "backend/app/document_registry.py"
      - "dev_mcp_server/src/albayan_dev_mcp/investigation.py"
      - "dev_mcp_server/src/albayan_dev_mcp/equation.py"
      - "backend/tests/test_document_command_schemas.py"
      - "backend/tests/test_round6_document_contract.py"
      - "backend/tests/test_document_migration_spec_integrity.py"
      - "backend/tests/test_draft_equations.py"
      - "backend/tests/test_equation_diagnostics.py"
      - "backend/tests/test_equation_mapping_api.py"
      - "backend/tests/test_equation_mapping_service.py"
      - "backend/tests/test_math_authoring_capabilities.py"
      - "backend/tests/test_ordered_index_math_contract.py"
      - "backend/tests/test_tracing.py"
      - "frontend/src/app/maktabi/layout.tsx"
      - "frontend/src/components/dashboard/article-editor-chrome.test.ts"
      - "frontend/src/components/dashboard/article-editor-header.tsx"
      - "frontend/src/components/dashboard/authoring-ux-followup.test.ts"
      - "frontend/src/components/dashboard/draft-history-dialog.tsx"
      - "frontend/src/components/dashboard/equation-mappings-editor-launcher.tsx"
      - "frontend/src/components/dashboard/equation-mappings-panel.tsx"
      - "frontend/src/components/dashboard/mapping-font-selector.module.css"
      - "frontend/src/components/dashboard/mapping-font-selector.tsx"
      - "frontend/src/components/main-nav.tsx"
      - "frontend/src/components/mobile-navigation-content.tsx"
      - "frontend/src/lib/api/equation-mappings.ts"
      - "frontend/src/lib/equation-mappings.ts"
      - "frontend/src/lib/equation-mappings.test.ts"
      - "frontend/src/lib/mapping-fonts.ts"
      - "frontend/src/lib/mapping-fonts.test.ts"
      - "mcp_server/src/albayan_mcp/schemas/draft_command.py"
      - "mcp_server/src/albayan_mcp/server.py"
      - "mcp_server/src/albayan_mcp/tools/block_projection.py"
      - "mcp_server/src/albayan_mcp/tools/drafts.py"
      - "mcp_server/src/albayan_mcp/tools/equations.py"
      - "mcp_server/src/albayan_mcp/tools/units.py"
      - "mcp_server/tests/test_unit_tools.py"
      - "mcp_server/tests/test_article_tools.py"
      - "mcp_server/tests/test_draft_block_projection.py"
      - "mcp_server/tests/test_draft_command_schema.py"
      - "mcp_server/tests/test_equation_tools.py"

jobs:
  equation-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            mcp_server/pyproject.toml
      - run: pip install -r backend/requirements.txt pytest
      - run: pip install -e mcp_server
      - name: Import backend application
        run: PYTHONPATH=backend python -c "import app.main"
      - name: Backend equation and tracing tests
        env:
          BURHAN_URL: ${{ secrets.BURHAN_URL }}
          BURHAN_API_KEY: ${{ secrets.BURHAN_API_KEY }}
        run: >-
          PYTHONPATH=backend pytest -q
          backend/tests/test_equation_mapping_service.py
          backend/tests/test_equation_mapping_api.py
          backend/tests/test_unit_conventions.py
          backend/tests/test_unit_discovery_contract.py
          backend/tests/test_used_unit_service.py
          backend/tests/test_burhan_api_key.py
          backend/tests/test_burhan_math_commands.py
          backend/tests/test_butex_math_projection_client.py
          backend/tests/test_round6_document_contract.py
          backend/tests/test_document_migration_spec_integrity.py
          backend/tests/test_document_command_schemas.py
          backend/tests/test_butex_worker_client.py
          backend/tests/test_butex_diff_client.py
          backend/tests/test_butex_real_worker_integration.py
          backend/tests/test_draft_equations.py
          backend/tests/test_equation_diagnostics.py
          backend/tests/test_document_diagnostics.py
          backend/tests/test_math_authoring_capabilities.py
          backend/tests/test_ordered_index_math_contract.py
          backend/tests/test_tracing.py
      - name: Immutable draft revision and structured math persistence tests
        run: >-
          PYTHONPATH=backend pytest -q
          backend/tests/test_draft_revisions.py
          backend/tests/test_round3_butex_consumer_contract.py
      - name: MCP equation and compact block tests
        run: >-
          PYTHONPATH=mcp_server/src:mcp_server pytest -q
          mcp_server/tests/test_draft_command_schema.py
          mcp_server/tests/test_document_schema.py
          mcp_server/tests/test_equation_tools.py
          mcp_server/tests/test_unit_tools.py
          mcp_server/tests/test_draft_block_projection.py
          mcp_server/tests/test_article_tools.py
      - name: Detect frontend equation changes
        id: frontend_changes
        shell: bash
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -q '^frontend/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.frontend_changes.outputs.run == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Download and attest the pinned private BuTeX candidate
        if: steps.frontend_changes.outputs.run == 'true'
        working-directory: frontend
        env:
          GITLAB_BUTEX_READ_TOKEN: ${{ secrets.GITLAB_BUTEX_READ_TOKEN }}
        run: node scripts/prepare-butex-candidate.mjs
      - name: Install frontend dependencies
        if: steps.frontend_changes.outputs.run == 'true'
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Frontend authoring and equation tests
        if: steps.frontend_changes.outputs.run == 'true'
        working-directory: frontend
        run: >-
          npx vitest run
          src/lib/equation-mappings.test.ts
          src/lib/butex-candidate-contract.test.ts
          src/lib/unit-conventions.test.ts
          src/lib/mapping-fonts.test.ts
          src/components/dashboard/article-editor-chrome.test.ts
          src/components/dashboard/authoring-ux-followup.test.ts
      - name: Frontend typecheck
        if: steps.frontend_changes.outputs.run == 'true'
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Frontend production build
        if: steps.frontend_changes.outputs.run == 'true'
        working-directory: frontend
        run: npm run build
