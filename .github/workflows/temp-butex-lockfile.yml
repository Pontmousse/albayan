name: Temporary BuTeX lockfile refresh

on:
  push:
    branches:
      - docs/equation-architecture-butex-7-1-0

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/equation-architecture-butex-7-1-0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate lockfile for BuTeX 7.1.0
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund @drghaliasri/butex@7.1.0
      - name: Validate clean install
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- frontend/package.json frontend/package-lock.json; then
            echo "No lockfile changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          git commit -m "chore(frontend): refresh BuTeX 7.1.0 lockfile"
          git push origin HEAD:docs/equation-architecture-butex-7-1-0
