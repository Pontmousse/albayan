name: Temporary Clerk security email verification

on:
  push:
    branches:
      - feat/clerk-security-email-templates
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest
      - name: Run Clerk email tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_clerk_email_webhook.py tests/test_email_service.py
