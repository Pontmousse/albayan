name: Refresh BuTeX lockfile

on:
  push:
    branches:
      - chore/bump-butex-7.1.1

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/bump-butex-7.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --fund=false
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json did not change" >&2
            exit 1
          fi
          git commit -m "chore: refresh BuTeX lockfile"
          git push origin HEAD:chore/bump-butex-7.1.1
