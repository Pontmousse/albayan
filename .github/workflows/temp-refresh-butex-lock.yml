name: Temporary BuTeX lock refresh

on:
  push:
    branches:
      - fix/issue-100-version-history-ux

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-100-version-history-ux
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate lockfile with npm
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-refresh-butex-lock.yml
          git add frontend/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh BuTeX 7.0.4 package lock"
          git push
