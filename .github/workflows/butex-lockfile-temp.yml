name: Temporary BuTeX lockfile generation

on:
  push:
    branches:
      - chore/bump-butex-6.1.5
    paths:
      - .github/workflows/butex-lockfile-temp.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate npm lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify BuTeX lockfile version
        working-directory: frontend
        run: node -e "const l=require('./package-lock.json'); if(l.packages[''].dependencies['@drghaliasri/butex']!=='^6.1.5'||l.packages['node_modules/@drghaliasri/butex']?.version!=='6.1.5') process.exit(1)"
      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git rm .github/workflows/butex-lockfile-temp.yml
          git commit -m "chore: sync BuTeX 6.1.5 lockfile"
          git push
