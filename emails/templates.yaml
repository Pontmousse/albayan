templates:
  - alias: welcome-ar
    name: "Al-Bayan Welcome"
    subject: "مجلة البيان ترحب بكم"
    file: "emails/src/Welcome.tsx"
    html_file: "emails/out/Welcome.html"
    variables:
      USER_NAME: string
      LOGIN_URL: string
      SITE_URL: string
      CONTACT_EMAIL: string
      ASSET_BASE_URL: string
    publish: true

  - alias: app-invitation-ar
    name: "Al-Bayan App Invitation"
    subject: "دعوة للانضمام إلى مجلة البيان"
    file: "emails/src/AppInvitation.tsx"
    html_file: "emails/out/AppInvitation.html"
    variables:
      INVITATION_URL: string
      RECIPIENT_EMAIL: string
      EXPIRES_TEXT: string
      SITE_URL: string
      CONTACT_EMAIL: string
      ASSET_BASE_URL: string
    publish: true

  - alias: auth-verification-code-ar
    name: "Al-Bayan Auth Verification Code"
    subject: "رمز التحقق من بريدكم في مجلة البيان"
    file: "emails/src/auth/VerificationCode.tsx"
    html_file: "emails/out/auth/VerificationCode.html"
    variables:
      OTP_CODE: string
      RECIPIENT_EMAIL: string
      SITE_URL: string
      CONTACT_EMAIL: string
      ASSET_BASE_URL: string
    publish: true

  - alias: password-reset-ar
    name: "Al-Bayan Password Reset"
    subject: "رمز استعادة كلمة المرور في مجلة البيان"
    file: "emails/src/auth/PasswordReset.tsx"
    html_file: "emails/out/auth/PasswordReset.html"
    variables:
      OTP_CODE: string
      RECIPIENT_EMAIL: string
      SITE_URL: string
      CONTACT_EMAIL: string
      ASSET_BASE_URL: string
    publish: true

