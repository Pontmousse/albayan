[project]
name = "albayan-mcp"
version = "2.0.0"
description = "خادم MCP لمجلة البيان — thin adapter فوق FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2,<3",
    "httpx>=0.27,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic-settings>=2,<3",
    "opentelemetry-api>=1,<2",
]

[project.scripts]
albayan-mcp = "albayan_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/albayan_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/albayan_mcp", "README.md"]
